version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: entertainment_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-entertainment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-entertainment_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - entertainment_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: entertainment_n8n
    restart: always
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.example.com}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_HOST:-n8n.example.com}/
      - GENERIC_TIMEZONE=Asia/Jakarta
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      - postgres
    networks:
      - entertainment_net

  nginx:
    image: nginx:alpine
    container_name: entertainment_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - n8n
    networks:
      - entertainment_net

volumes:
  postgres_data:
  n8n_data:
  certbot_certs:
  certbot_www:

networks:
  entertainment_net:
    driver: bridge
